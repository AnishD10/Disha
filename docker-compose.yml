services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: disha-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: disha_db
      MYSQL_USER: disha_user
      MYSQL_PASSWORD: disha_pass
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # Initialize database with schema
      - ./sql/Disha_assessment.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # Persist database data
      - disha-mysql-data:/var/lib/mysql
    networks:
      - disha-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Java Web Application Service
  java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disha-app
    ports:
      - "8081:8080"
    environment:
      # Database configuration
      DISHA_DB_URL: "jdbc:mysql://mysql-db:3306/disha_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
      DISHA_DB_USERNAME: disha_user
      DISHA_DB_PASSWORD: disha_pass
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - disha-network
    volumes:
      # Map subdirectories for live-reloading without overwriting WEB-INF/lib
      - ./src/main/webapp/jsp:/usr/local/tomcat/webapps/ROOT/jsp
      - ./src/main/webapp/css:/usr/local/tomcat/webapps/ROOT/css
      - ./src/main/webapp/js:/usr/local/tomcat/webapps/ROOT/js
      - ./src/main/webapp/images:/usr/local/tomcat/webapps/ROOT/images
    restart: unless-stopped

networks:
  disha-network:
    driver: bridge

volumes:
  disha-mysql-data:
    driver: local
