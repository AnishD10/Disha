services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: disha-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: disha_db
      MYSQL_USER: disha_user
      MYSQL_PASSWORD: disha_pass
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # Initialize database with schema
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/init.sql:/docker-entrypoint-initdb.d/02-init.sql
      # Persist database data
      - disha-mysql-data:/var/lib/mysql
    networks:
      - disha-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Java Web Application Service
  java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disha-app
    ports:
      - "8080:8080"
    environment:
      # Database configuration
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: disha_db
      DB_USER: disha_user
      DB_PASSWORD: disha_pass
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - disha-network
    volumes:
      # Live reload specific frontend folders only without obscuring WEB-INF
      - ./WebContent/JSP:/opt/tomcat/webapps/ROOT/JSP
      - ./WebContent/CSS:/opt/tomcat/webapps/ROOT/CSS
      - ./WebContent/index.jsp:/opt/tomcat/webapps/ROOT/index.jsp
    restart: unless-stopped

networks:
  disha-network:
    driver: bridge

volumes:
  disha-mysql-data:
    driver: local
