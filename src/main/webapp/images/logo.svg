<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <!-- Outer compass ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#g1)" stroke-width="3.5"/>

  <!-- Mountain peak (Nepal motif) -->
  <path d="M14 44 L25 24 L32 33 L39 20 L50 44 Z" fill="url(#g1)" opacity="0.92"/>

  <!-- Snow cap highlights -->
  <path d="M39 20 L43 28 L35 28 Z" fill="white" opacity="0.55"/>
  <path d="M25 24 L28 30 L22 30 Z" fill="white" opacity="0.40"/>

  <!-- Compass north tick -->
  <line x1="32" y1="2" x2="32" y2="8" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>

  <defs>
    <linearGradient id="g1" x1="14" y1="20" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C0392B"/>
      <stop offset="1" stop-color="#E67E22"/>
    </linearGradient>
  </defs>
</svg>